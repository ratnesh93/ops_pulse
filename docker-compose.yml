services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opspulse
      POSTGRES_USER: opspulse
      POSTGRES_PASSWORD: opspulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspulse -d opspulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opspulse
      SPRING_DATASOURCE_USERNAME: opspulse
      SPRING_DATASOURCE_PASSWORD: opspulse
      DATA_PATH: /data/moveinsync
      TRIP_FILE: "Ride_data _trip-July_2026.csv"
      PRIOR_TRIP_FILE: "Ride_data _trip-June_2026.csv"
      BILL_FILE: bill_data.csv
      ANALYSIS_VENDOR: "Rohan Mikhailov Travel"
      PEER_VENDOR: "Priya Mikhailov Travel"
      SLA_OTA_PCT: "90"
      SKIP_DATA_LOAD: "false"
      SARVAM_API_KEY: "${SARVAM_API_KEY:-}"
    volumes:
      - ../data/MoveInSync - Anonymised Trip-Log Dataset-20260905T010918Z-1-001/MoveInSync - Anonymised Trip-Log Dataset:/data/moveinsync:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4210:80"
    depends_on:
      - backend

volumes:
  pgdata:
