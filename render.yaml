databases:
  - name: opspulse-db
    plan: free
    databaseName: opspulse
    user: opspulse

services:
  - type: web
    name: opspulse-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: opspulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: opspulse-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: opspulse-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: opspulse-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: opspulse-db
          property: password
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: DATA_PATH
        value: /data/moveinsync
      - key: SKIP_DATA_LOAD
        value: "true"
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: opspulse-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Render free: frontend reaches backend via public onrender.com URL (nginx proxy).
      - key: BACKEND_SCHEME
        value: https
      - key: BACKEND_HOST
        fromService:
          name: opspulse-api
          type: web
          property: host
      - key: BACKEND_DOMAIN_SUFFIX
        value: .onrender.com
