# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo → apply
#
# After first deploy:
#   1. Upload MoveInSync CSVs to the API disk (see README § Render.com)
#   2. Set SKIP_DATA_LOAD=false on opspulse-api and redeploy
#   3. Optional: set SARVAM_API_KEY for voice chat

services:
  # Spring Boot API
  - type: web
    name: opspulse-api
    runtime: docker
    plan: starter
    #region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    disk:
      name: opspulse-data
      mountPath: /data/moveinsync
      sizeGB: 2
    envVars:
      - key: PORT
        value: "8080"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx512m -Xms256m"
      - key: DB_HOST
        fromDatabase:
          name: opspulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: opspulse-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: opspulse-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: opspulse-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: opspulse-db
          property: password
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: DATA_PATH
        value: /data/moveinsync
      - key: TRIP_FILE
        value: "Ride_data _trip-July_2026.csv"
      - key: PRIOR_TRIP_FILE
        value: "Ride_data _trip-June_2026.csv"
      - key: BILL_FILE
        value: bill_data.csv
      - key: ANALYSIS_VENDOR
        value: "Rohan Mikhailov Travel"
      - key: PEER_VENDOR
        value: "Priya Mikhailov Travel"
      - key: SLA_OTA_PCT
        value: "90"
      - key: SKIP_DATA_LOAD
        value: "true"
      - key: SARVAM_API_KEY
        sync: false

  # React static site (CDN)
  - type: web
    name: opspulse-web
    runtime: static
    plan: free
    #region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: opspulse-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: opspulse-db
    plan: basic-256mb
    #region: oregon
    databaseName: opspulse
    user: opspulse
